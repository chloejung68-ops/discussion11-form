<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engaged Learning Student Feedback</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main>
        <h1>Engaged Learning Student Feedback Form</h1>

        <p>
            Share your engaged learning experience to help
            improve resources and support for UMSI students.
        </p>

        <form action="https://formspree.io/f/xkjrnbbg" method="post">
            <p class="form-note">Fields marked (required) must be completed. The project start date is optional.</p>

            <fieldset>
                <legend>Student Information</legend>

                <label for="first-name">First Name (required):</label>
                <input type="text" id="first-name" name="first-name" autocomplete="given-name" required>

                <label for="last-name">Last Name (required):</label>
                <input type="text" id="last-name" name="last-name" autocomplete="family-name" required>

                <label for="email">Email Address (required):</label>
                <input type="email" id="email" autocomplete="email" name="email" required>

                <label for="program">Academic Program (required):</label>
                <select id="program" name="program" required>
                    <option value="">Select your program</option>
                    <option value="bsi">BSI</option>
                    <option value="msi">MSI</option>
                    <option value="mhi">MHI</option>
                    <option value="phd">PhD</option>
                    <option value="other">Other</option>
                </select>

            </fieldset>

            <fieldset class="radio-group">
                <legend>Current or Most Recent Project Stage (required)</legend>

                <div class="radio-option">
                    <input type="radio" id="preparing" name="stage" value="preparing" required>
                    <label for="preparing">Preparing for the Experience</label>
                </div>

                <div class="radio-option">
                    <input type="radio" id="starting" name="stage" value="starting">
                    <label for="starting">Starting the Experience</label>
                </div>

                <div class="radio-option">
                    <input type="radio" id="during" name="stage" value="during">
                    <label for="during">During the Experience</label>
                </div>

                <div class="radio-option">
                    <input type="radio" id="ending" name="stage" value="ending">
                    <label for="ending">Ending the Experience</label>
                </div>

                <div class="radio-option">
                    <input type="radio" id="after" name="stage" value="after">
                    <label for="after">After the Experience</label>
                </div>
            </fieldset>

            <fieldset>
                <legend>Your Feedback</legend>

                <label for="project-start-date">Project Start Date (optional):</label>
                <input type="date" id="project-start-date" name="project-start-date">

                <label for="feedback">Your Feedback (required):</label>
                <textarea id="feedback" name="feedback" rows="5" required></textarea>

            </fieldset>

            <input type="submit" value="Submit Feedback">

        </form>
    </main>
    <script>
        const form = document.querySelector('form');
        const fields = form.querySelectorAll('input:not([type="submit"]), select, textarea');

        function showError(field) {
            const errorId = `${field.id}-error`;
            let error = document.getElementById(errorId);
            if (field.validity.valid) {
                field.removeAttribute('aria-invalid');
                field.removeAttribute('aria-describedby');
                if (error) error.remove();
                return;
            }
            field.setAttribute('aria-invalid', 'true');
            field.setAttribute('aria-describedby', errorId);
            if (!error) {
                error = document.createElement('p');
                error.id = errorId;
                error.className = 'field-error';
                const target = field.type === 'radio' ? field.closest('fieldset') : field;
                target.insertAdjacentElement('afterend', error);
            }
            error.textContent = `Error: ${field.validationMessage}`;
        }

        fields.forEach(field => {
            field.addEventListener('invalid', () => showError(field));
            field.addEventListener('input', () => {
                if (field.type === 'radio') {
                    form.querySelectorAll('input[name="stage"]').forEach(showError);
                } else if (field.hasAttribute('aria-invalid')) {
                    showError(field);
                }
            });
        });

    </script>
</body>

</html>
